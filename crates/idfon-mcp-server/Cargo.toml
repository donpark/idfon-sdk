[package]
name = "idfon-mcp-server"
version.workspace = true
edition = "2021"
license.workspace = true
description = "MCP server adapter over stdio: idfon capabilities as tools, with consent kept in the daemon."

[[bin]]
name = "idfon-mcp-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
idfon-client = { path = "../../../idfon-core/crates/idfon-client" }
idfon-protocol = { path = "../../../idfon-core/crates/idfon-protocol" }
idfon-telemetry = { path = "../../../idfon-core/crates/idfon-telemetry", features = ["otlp"] }
serde_json = "1"