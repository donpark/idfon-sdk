[workspace]
resolver = "2"
members = ["crates/idfon-protocol", "crates/idfon-telemetry", "crates/idfon-core", "crates/idfon-media", "crates/idfon-voice", "crates/idfon-gateway", "crates/idfon-h3", "crates/idfon-h1", "crates/idfon-channel", "crates/idfon-edge", "crates/idfon-mcp", "crates/idfon-mcp-server", "crates/eve-idfon", "crates/idfon-live-media", "crates/idfon-radio", "crates/idfon-voice-agent", "crates/idfon-director", "crates/idfond", "crates/idfon-cli", "crates/idfon-client", "crates/idfon-daemon", "crates/iroh-c-ffi"]

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.11.0"

# Dev/test artifacts are a byproduct of `cargo check`/`cargo test`, never of the
# shipping iOS/macOS builds — those are release. Full debuginfo made
# target/debug 97 GB across 186k files (one artifact set per feature/metadata
# hash, nothing pruned). Line tables keep useful backtraces at a fraction of
# the size; dependencies need no symbols at all.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.release]
# thin, not fat: fat LTO doubles every rlib (bitcode) and makes each relink of
# the ~350-crate graph minutes; thin LTO keeps cross-crate inlining at a
# fraction of the link/intermediate cost. Flip back to "fat" for a release
# build if profiling says the media path needs it.
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# spike/iroh-live-next: forks dropped; iroh-live and moq come from upstream revs in the crates.
