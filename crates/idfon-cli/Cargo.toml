[package]
name = "idfon-cli"
version.workspace = true
edition = "2021"
license.workspace = true
description = "The idfon CLI: noun-verb subcommands mapped onto daemon IPC methods."

[[bin]]
name = "idfon"
path = "src/main.rs"

[dependencies]
idfon-config = { path = "../../../idfon-core/crates/idfon-config" }
clap = { version = "4", features = ["derive"] }
idfon-client = { path = "../../../idfon-core/crates/idfon-client" }
idfon-protocol = { path = "../../../idfon-core/crates/idfon-protocol" }
idfon-telemetry = { path = "../../../idfon-core/crates/idfon-telemetry", features = ["otlp"] }
serde_json = "1"
