[package]
name = "idfon-voice-agent"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Voice-agent kit and the eve-idfon-voice runner: one config, pluggable voice backends."

[[bin]]
name = "eve-idfon-voice"
path = "src/main.rs"

# Text turns through an OpenAI-compatible chat endpoint, in place of the Node
# bridge + Eve (the App Review demo contact, idfon-edge deploy/reviewer).
[[bin]]
name = "idfon-chat-responder"
path = "src/chat_responder.rs"

[features]
default = []
# Full-duplex OpenAI Live-API (`gpt-live-1`) backend. Off by default so a
# cascade/relay deployment does not link the vendored realtime stack.
gpt-live = ["dep:tokio-websockets", "dep:rustls", "dep:futures-util"]

[dev-dependencies]
idfon-director = { path = "../../../idfon-core/crates/idfon-director" }

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ed25519-dalek = "3"
eve-idfon = { path = "../eve-idfon" }
futures-util = { version = "0.3", optional = true }
idfon-core = { path = "../../../idfon-core/crates/idfon-core" }
idfon-live-media = { path = "../idfon-live-media" }
idfon-radio = { path = "../idfon-radio" }
idfon-protocol = { path = "../../../idfon-core/crates/idfon-protocol" }
idfon-voice = { path = "../../../idfon-core/crates/idfon-voice", features = ["gateway"] }
iroh = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "ring", "rustls-webpki-roots"], optional = true }
