<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Send feedback</title>
<style>/*UI_SDK_CSS*/</style>
<style>
  :root { font: -apple-system-body; font-family: system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: var(--ui-background); color: var(--ui-foreground); }
  main { max-width: 32rem; margin: 0 auto; padding: 20px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--ui-muted-foreground); }
  form { display: grid; gap: 20px; }
  form[hidden] { display: none; }
  ui-segmented-control { width: 100%; border-radius: 10px; }
  ui-segmented-control-item { flex: 1; min-height: 36px; }
  ui-segmented-control-item, ui-segmented-control-indicator { border-radius: 8px; }
  ui-rating-item[data-slot="rating-item"] { --ui-rating-color: #f5b400; width: 2rem; height: 2rem; }
  ui-rating-item[data-slot="rating-item"][data-highlighted] { --ui-rating-color: #f5b40099; }
  textarea { min-height: 7.5rem; font: inherit; border-radius: 10px; }
  #send button {
    width: 100%; min-height: 48px; font: inherit; font-weight: 600; border: 0; border-radius: 12px;
    background: #0a84ff; color: #fff;
  }
  #send button:disabled { opacity: 0.4; }
  #status { margin-top: 16px; font-weight: 600; }
  #status:empty { display: none; }
</style>
</head>
<body>
<main>
  <h1>Send feedback</h1>
  <p class="lead">It goes straight to the idfon team.</p>
  <form id="feedback">
    <ui-field>
      <ui-field-label>Type</ui-field-label>
      <ui-segmented-control id="category" default-value="bug">
        <ui-segmented-control-indicator></ui-segmented-control-indicator>
        <ui-segmented-control-item value="bug">Bug</ui-segmented-control-item>
        <ui-segmented-control-item value="idea">Idea</ui-segmented-control-item>
        <ui-segmented-control-item value="other">Other</ui-segmented-control-item>
      </ui-segmented-control>
    </ui-field>
    <ui-field>
      <ui-field-label>How is idfon so far? (optional)</ui-field-label>
      <ui-rating id="rating" aria-label="Rating">
        <template>
          <ui-rating-item>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
          </ui-rating-item>
        </template>
      </ui-rating>
    </ui-field>
    <ui-field>
      <ui-field-label>Details</ui-field-label>
      <ui-textarea>
        <textarea id="text" rows="5" maxlength="4000"></textarea>
      </ui-textarea>
    </ui-field>
    <ui-button id="send"><button type="button">Send</button></ui-button>
  </form>
  <p id="status" role="status"></p>
</main>
<script>/*PAGE_JS*/</script>
</body>
</html>
