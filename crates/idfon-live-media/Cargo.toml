[package]
name = "idfon-live-media"
version.workspace = true
edition = "2021"
license.workspace = true
description = "MoQ plumbing shared by live-call handlers: invite parsing, PCM subscribe, return-leg publish and signing."

[dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1"
ed25519-dalek = "3"
idfon-core = { path = "../idfon-core" }
idfon-protocol = { path = "../idfon-protocol" }
iroh = "1"
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "60a3fcfc0dd2416f640496a2787404552b45cdb3", default-features = false }
moq-audio = { git = "https://github.com/moq-dev/moq", rev = "4a6f522483168ace392718d68b58a402533c897d", default-features = false }
moq-ext-publisher = { git = "https://github.com/n0-computer/iroh-live", rev = "60a3fcfc0dd2416f640496a2787404552b45cdb3", default-features = false }
moq-ext-player = { git = "https://github.com/n0-computer/iroh-live", rev = "60a3fcfc0dd2416f640496a2787404552b45cdb3", default-features = false }
moq-ext-sources = { git = "https://github.com/n0-computer/iroh-live", rev = "60a3fcfc0dd2416f640496a2787404552b45cdb3", default-features = false }
moq-ext-adaptive = { git = "https://github.com/n0-computer/iroh-live", rev = "60a3fcfc0dd2416f640496a2787404552b45cdb3" }
moq-net = { git = "https://github.com/moq-dev/moq", rev = "4a6f522483168ace392718d68b58a402533c897d" }
n0-future = "0.3.2"
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
futures-util = "0.3"
