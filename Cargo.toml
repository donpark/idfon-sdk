[workspace]
resolver = "2"
members = ["crates/eve-idfon", "crates/idfon-cli", "crates/idfon-live-media", "crates/idfon-mcp-server", "crates/idfon-radio", "crates/idfon-voice-agent"]

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.14.0"

# Dev/test artifacts are a byproduct of `cargo check`/`cargo test`, never of the
# shipping iOS/macOS builds — those are release. Full debuginfo made
# target/debug 97 GB across 186k files (one artifact set per feature/metadata
# hash, nothing pruned). Line tables keep useful backtraces at a fraction of
# the size; dependencies need no symbols at all.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.release]
# thin, not fat: fat LTO doubles every rlib (bitcode) and makes each relink of
# the ~350-crate graph minutes; thin LTO keeps cross-crate inlining at a
# fraction of the link/intermediate cost. Flip back to "fat" for a release
# build if profiling says the media path needs it.
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"


# Forks, pinned by rev (iroh-live upgrade, donpark/idfon#209):
# - moq: donpark/moq branch liquid-codec-next, on moq-dev/moq 4a6f52248 (the rev
#   iroh-live pins). LiquidCodec, libopus 1.6.1, opt-in gap recovery, Opus FEC knob.
# - iroh-live: donpark/iroh-live branch audio-renditions-next, on n0-computer 60a3fcf.
#   Publisher-ordered audio renditions, player rendition choice, live bitrate retune,
#   mDNS via iroh-mdns-address-lookup (iroh-mdns-peer-lookup declares no license).
