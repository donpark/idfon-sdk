[workspace]
resolver = "2"
members = ["crates/idfon-protocol", "crates/idfon-telemetry", "crates/idfon-core", "crates/idfon-media", "crates/idfon-voice", "crates/idfon-gateway", "crates/idfon-h3", "crates/idfon-h1", "crates/idfon-channel", "crates/idfon-edge", "crates/idfon-mcp", "crates/idfon-mcp-server", "crates/eve-idfon", "crates/idfon-live-media", "crates/idfon-radio", "crates/idfon-voice-agent", "crates/idfon-director", "crates/idfond", "crates/idfon-cli", "crates/idfon-client", "crates/idfon-daemon", "crates/iroh-c-ffi"]

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.11.0"

# Dev/test artifacts are a byproduct of `cargo check`/`cargo test`, never of the
# shipping iOS/macOS builds — those are release. Full debuginfo made
# target/debug 97 GB across 186k files (one artifact set per feature/metadata
# hash, nothing pruned). Line tables keep useful backtraces at a fraction of
# the size; dependencies need no symbols at all.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.release]
# thin, not fat: fat LTO doubles every rlib (bitcode) and makes each relink of
# the ~350-crate graph minutes; thin LTO keeps cross-crate inlining at a
# fraction of the link/intermediate cost. Flip back to "fat" for a release
# build if profiling says the media path needs it.
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[patch.crates-io]
# Fork branch of moq-dev/moq `main` (post history-rewrite; the old lineage is
# frozen and has no common ancestor with it) carrying decode-side loss
# recovery (Decoder::recover + Consumer `conceal`), a working encoder FEC knob
# (upstream removed theirs as ineffective; ours also sets the loss-rate hint
# libopus needs to write the LBRR copy), and the shared BitrateControl. Keep
# the fork patched until these land upstream; all five crates point at the one
# branch so their internal path-deps unify to a single instance each (mixing
# two git sources splits moq_net/moq_mux types). Update procedure:
# docs/moq-fork.md.
hang = { git = "https://github.com/donpark/moq", branch = "liquid-codec" }
moq-audio = { git = "https://github.com/donpark/moq", branch = "liquid-codec" }
moq-mux = { git = "https://github.com/donpark/moq", branch = "liquid-codec" }
moq-net = { git = "https://github.com/donpark/moq", branch = "liquid-codec" }
moq-video = { git = "https://github.com/donpark/moq", branch = "liquid-codec" }
moq-tokio = { git = "https://github.com/donpark/moq", branch = "liquid-codec" }
moq-media = { git = "https://github.com/donpark/iroh-live", branch = "audio-renditions" }
# Match the MoQ development snapshot selected by the current iroh-live rev.
iroh-moq = { git = "https://github.com/donpark/iroh-live", branch = "audio-renditions" }

# iroh-live fork (donpark/iroh-live `audio-renditions`, off the dd80d44 pin above):
# moq-media publishes several audio renditions so a subscriber can pick and switch
# codecs mid-call (idfon-home docs/liquidcodec.md). Every iroh-live crate comes
# from the fork so their shared types stay one instance.
[patch."https://github.com/n0-computer/iroh-live"]
moq-media = { git = "https://github.com/donpark/iroh-live", branch = "audio-renditions" }
iroh-moq = { git = "https://github.com/donpark/iroh-live", branch = "audio-renditions" }
iroh-live = { git = "https://github.com/donpark/iroh-live", branch = "audio-renditions" }
